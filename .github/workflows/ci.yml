name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check pipeline cli newsletter tests scripts
      - name: Tests
        run: uv run pytest
      - name: Site data builds
        run: uv run python -m pipeline.run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site builds
        working-directory: site
        run: npm ci && npm run build
