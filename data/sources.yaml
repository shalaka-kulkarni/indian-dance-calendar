# Source registry — everywhere Indian dance events in the NYC metro get announced.
#
# strategy: jsonld = schema.org/Event structured data embedded in pages (preferred,
#           rots slowest) | ics = calendar feed | html = bespoke parser |
#           api = platform API client | search = discovery search battery |
#           manual = human-entered only
#
# NOTE: strategies below are best-guesses pending the first live audit
# (this build environment cannot reach these sites). The sweep tries JSON-LD
# first for every 'jsonld'/'html' source and falls back gracefully; the
# healthcheck flags any source that yields nothing so parsers get fixed fast.

sources:
  # ── Mainstream Manhattan ────────────────────────────────────────────────
  - id: joyce
    name: The Joyce Theater
    circuit: mainstream
    strategy: jsonld
    url: https://www.joyce.org/performances
    region: manhattan
    scrape_all_listings: true
    notes: "Premier NYC dance house; books Nrityagram. Tessitura-based site."
  - id: carnegie
    name: Carnegie Hall (full calendar)
    circuit: mainstream
    strategy: jsonld
    url: https://www.carnegiehall.org/Calendar
    region: manhattan
    scrape_all_listings: true
    notes: "MUST use the full calendar: rentals (e.g. All-Indian Dance Festival) never appear in Carnegie's own marketing."
