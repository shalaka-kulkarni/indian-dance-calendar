# registered: skyd scheduled job
name: deploy-site
# Build the Astro site and publish to GitHub Pages. Runs on every change to
# event data or the site itself, so sweep commits redeploy automatically.

on:
  push:
    branches: [claude/indian-dance-ramp-up-plan-4nkxxp, main]
    paths:
      - "site/**"
      - "data/events/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v5
      - name: Generate site data from event store
        run: uv venv && uv pip install -e . && uv run python -m pipeline.run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /indian-dance-calendar
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
