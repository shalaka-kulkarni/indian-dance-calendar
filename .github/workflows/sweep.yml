name: sweep
# Scrape every registered source, classify new events with Claude, run the
# publish checker, rebuild site data, and commit. Runs unattended.

on:
  schedule:
    - cron: "0 11 * * 1,3,5" # Mon/Wed/Fri ~6-7am ET
  workflow_dispatch:

concurrency:
  group: event-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv && uv pip install -e .
      - name: Sweep all sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: uv run python -m pipeline.run sweep
      - name: Classify anything still unclassified (seeds, prior keyless runs)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m pipeline.run classify
      - name: Re-validate everything live (links, dates, prices)
        run: uv run python -m pipeline.run validate
      - name: Rebuild site data
        run: uv run python -m pipeline.run build
      - name: Commit
        run: |
          git config user.name "skyd-sweep"
          git config user.email "actions@users.noreply.github.com"
          git add data/events site/src/data/events.json site/public/calendar.ics
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sweep: automated event update"
            git push
          fi
