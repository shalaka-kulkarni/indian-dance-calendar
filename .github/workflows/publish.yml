# registered: skyd scheduled job
name: publish
# Runs when event data is pushed from outside GitHub Actions (e.g. a Claude
# session that classified pending events): re-validates with live link checks,
# publishes what passes, and rebuilds site data. Pushes made BY workflows use
# GITHUB_TOKEN and never re-trigger this, so there is no loop.

on:
  push:
    branches: [main, claude/indian-dance-ramp-up-plan-4nkxxp]
    paths:
      - "data/events/**"
  workflow_dispatch:

concurrency:
  group: event-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatched or scheduled run pins its SHA when it is QUEUED, so a
          # job that waited behind another writer starts from a stale tree and
          # its commit conflicts on push. Always start from the branch tip.
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv && uv pip install -e .
      - name: Validate (live link checks) and publish
        run: uv run python -m pipeline.run validate
      - name: Commit
        run: |
          git config user.name "skyd-publish"
          git config user.email "actions@users.noreply.github.com"
          git add data/events
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "publish: validate after event-data push"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              # A conflicted rebase leaves unmerged files behind, and every
              # later attempt then fails on "Pulling is not possible" rather
              # than on the race it was retrying. Clear it before going again.
              git rebase --abort 2>/dev/null || true
              echo "push race, retrying ($attempt)"; sleep 5
            done
            exit 1
          fi
