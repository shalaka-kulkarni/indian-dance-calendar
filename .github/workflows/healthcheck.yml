# registered: skyd scheduled job
name: healthcheck
# Weekly: re-verify every published event's links and surface broken scrapers
# and the needs_attention queue as a GitHub issue — rot is loud, never silent.

on:
  schedule:
    - cron: "0 13 * * 6" # Saturdays ~8-9am ET
  workflow_dispatch:

concurrency:
  group: event-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatched or scheduled run pins its SHA when it is QUEUED, so a
          # job that waited behind another writer starts from a stale tree and
          # its commit conflicts on push. Always start from the branch tip.
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv && uv pip install -e .
      - name: Re-validate all live events (full link check)
        run: uv run python -m pipeline.run validate
      - name: Commit
        run: |
          git config user.name "skyd-healthcheck"
          git config user.email "actions@users.noreply.github.com"
          git add data/events
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "healthcheck: revalidation update"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              # A conflicted rebase leaves unmerged files behind, and every
              # later attempt then fails on "Pulling is not possible" rather
              # than on the race it was retrying. Clear it before going again.
              git rebase --abort 2>/dev/null || true
              echo "push race, retrying ($attempt)"; sleep 5
            done
            exit 1
          fi
      - name: Report queue and source health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m pipeline.run report > report.txt || true
          cat report.txt

          # One long-lived issue that tracks the queue, rather than a new issue
          # every week restating the same two events. Reopened and rewritten
          # when the queue is non-empty, closed when it clears.
          TITLE="Healthcheck: events need attention"
          EXISTING=$(gh issue list --state all --limit 20 \
            --search "\"$TITLE\" in:title" --json number,state \
            --jq 'first(.[]) | .number' 2>/dev/null || true)

          if grep -q "needs_attention queue (0)" report.txt; then
            echo "queue empty"
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "Queue cleared as of $(date -u +'%F %H:%M UTC')." || true
            fi
          else
            BODY=$(printf 'Updated %s by the weekly healthcheck.\n\n```\n%s\n```' \
              "$(date -u +'%F %H:%M UTC')" "$(cat report.txt)")
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY" || true
              gh issue reopen "$EXISTING" 2>/dev/null || true
            else
              gh issue create --title "$TITLE" --body "$BODY" || true
            fi
          fi